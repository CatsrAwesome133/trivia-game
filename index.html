<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trivia Generator (Demo)</title>
    <script src="script.js"></script>
    <link rel="icon" type="image/x-icon" href="">
    <link rel="stylesheet" type="text/css" href="style.css" media="all">
    <style>
        h2 {
            margin-left: -5px;
            margin-right: -5px;
        }
        body {
            padding: 10px;
        }
    </style>
</head>
<body>
    <div>
        <h1>
          <i>Trivia!</i>
        </h1>
        <p>
            Request questions one at a time
        </p>
        <form method="get" action="play.html">
            Questions: <input type="text" name="q-no">
            <div>
                <button id="start" type="submit">Start</button>
                <button type="reset">Reset</button>
            </div>
        </form>
        <p id="test">test</p>
        <div id="tutorial">
            <h2>How to play:</h2>
            <p>Click start, then try to pick the correct answer!</p>
            <p>Incorrect answers will lose you 1 point, while correct answers gain you 2.</p>
        </div>
    </div>
    <div class="bar-bottom"></div>
</body>
</html>
